# ============================================
# HOST NGINX CONFIG for LPG Backend API
# ============================================
# Copy this file to your host's Nginx config:
#   sudo cp lpg-backend.host.conf /etc/nginx/sites-available/lpg-backend
#   sudo ln -s /etc/nginx/sites-available/lpg-backend /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name api.find-lpg.app;
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name api.find-lpg.app;

    # Document root (for static files served by Nginx directly)
    root /var/DOCKER/lpg-backend/public;
    index index.php index.html;

    # SSL Certificate (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.find-lpg.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.find-lpg.app/privkey.pem;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Logging
    error_log /var/log/nginx/lpg-backend-error.log;
    access_log /var/log/nginx/lpg-backend-access.log;

    # Max upload size
    client_max_body_size 50M;

    # Pass PHP requests to Docker PHP-FPM container on port 9000
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    # Laravel routing - try static files first, then pass to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    # Deny access to hidden files
    location ~ /\.(?!well-known) {
        deny all;
    }
}
